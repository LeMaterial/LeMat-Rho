[project]
name = "lemat-rho"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.25.0",
    "ipykernel>=6.29.5",
    "material-hasher",
    "atomate2",
    "fireworks",
    "torch>=2.0",
    "numpy>=1.24",
    "e3nn>=0.5.0",
    "scipy>=1.10.0",
    "lz4>=4.0.0",
    "pyarrow>=14.0.0",
    "wandb>=0.16.0",
    "python-dotenv>=1.0.0",
    "metatensor>=0.2.0",
    "chemfiles>=0.10.4",
    "graph2mat>=0.0.13",
    # BOA (boa_ft) arm. BOA/scdp/mldft themselves are editable-installed from
    # the sibling ../boa clone (see boa_ft/README.md), so only their runtime
    # dependencies are listed here. torch-cluster is deliberately omitted: the
    # boa_ft PBC edge builder replaces the only radius_graph call.
    "hydra-core>=1.3.2",
    "lightning>=2.5.0",
    "torch_ema>=0.3",
    "torch_geometric>=2.5.0",
    "pyscf>=2.5.0",
    "lmdb>=1.4.1",
    "mp-pyrho>=0.3.0",
    "basis-set-exchange>=0.9.1",
    "pymatgen>=2023.11.12",
    "rootutils>=1.0.7",
    "loguru>=0.7.0",
    "p_tqdm>=1.4.0",
]

[tool.uv.sources]
material-hasher = { git = "https://github.com/LeMaterial/lematerial-hasher" }

[tool.ruff.lint.per-file-ignores]
# Vendored from peterbjorgensen/DeepDFT; keep upstream's root-logger and %-format style.
"deepdft_ft/runner.py" = ["LOG015", "UP031"]
