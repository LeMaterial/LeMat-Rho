    "material-hasher @ git+https://github.com/LeMaterial/lematerial-hasher.git",
    "pymatgen>=2024.11.13",
]

[tool.uv.sources]
material-hasher = { git = "https://github.com/LeMaterial/lematerial-hasher" }
